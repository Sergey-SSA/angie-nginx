#limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_req_zone $binary_remote_addr zone=z1:10m rate=2r/s;

acme_client stepinit https://acme-v02.api.letsencrypt.org/directory;

server {
    set $root_path '/var/www/html/coffee';
    listen       443 ssl;
    listen       443 quic reuseport;
    listen       80;
    server_name  stepinit.ru www.stepinit.ru;
    acme stepinit;
    #return 301 https://www.stepinit.ru$request_uri;

    http2 on;
    http3 on;

    ssl_certificate $acme_cert_stepinit;
    ssl_certificate_key $acme_cert_key_stepinit;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 28h;

    #access_log  /var/log/angie/host.access.log  main;

    status_zone $host zone=host_zone:10;

    location / {
        #limit_conn addr 1;
        limit_req zone=z1 burst=5 nodelay;
        satisfy all;
        allow all;
        deny 192.168.64.1;
        auth_basic "closed site";
        auth_basic_user_file /etc/angie/htpasswd;
        root   $root_path;
        index  index.html index.htm;
    }

    location /status/ {
        api     /status/;
        allow   127.0.0.1;
        deny    all;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/angie/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with angie's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
    location /console/ {

       auto_redirect on;

        alias /usr/share/angie-console-light/html/;
        # Только во FreeBSD:
        # alias /usr/local/www/angie-console-light/html/;
        index index.html;

        location /console/api/ {
            api /status/;
    }

    # Чтобы после аутентификации работали функции редактирования (только PRO)
    location /console/api/config/ {

        auth_basic           "Защищенный сайт";
        auth_basic_user_file conf/htpasswd;

        api /config/;
    }
}
}